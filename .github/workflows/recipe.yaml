name: Flex Recipe

on:
  push:
    branches: [ master ]
  pull_request:

jobs:

  recipe:

    name: PHP ${{ matrix.php }} / Sylius ${{ matrix.sylius }}${{ matrix.symfony && format(' / Symfony {0}', matrix.symfony) || '' }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        sylius: ["~2.0.0", "~2.1.0"]
        include:
          - { php: '8.3', sylius: '~2.2.0' }
          - { php: '8.4', sylius: '~2.3.0', symfony: '~8' }
          - { php: '8.5', sylius: '~2.3.0', symfony: '~8' }

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, intl, json
          ini-values: date.timezone=UTC
          tools: symfony-cli

      - name: Set project php-version
        run: |
          echo ${{ matrix.php }} > .php-version

      - uses: actions/checkout@v3
        with:
          path: plugin

      - name: Determine composer cache directory
        id: composer-cache-directory
        working-directory: plugin
        run: echo "directory=$(composer config cache-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies installed with composer
        uses: actions/cache@v3
        id: cache-composer
        with:
          path: ${{ steps.composer-cache-directory.outputs.directory }}
          key: composer2-php:${{ matrix.php }}-sylius:${{ matrix.sylius }}-symfony:${{ matrix.symfony }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer2-php:${{ matrix.php }}-sylius:${{ matrix.sylius }}-symfony:${{ matrix.symfony }}-

      - name: Ensure that composer cache directory exists
        run: mkdir -p ${{ steps.composer-cache-directory.outputs.directory }}

      - name: Composer Github Auth
        run: composer config -g github-oauth.github.com ${{ github.token }}

      - name: Create Sylius-Standard project without install
        run: |
          composer create-project --prefer-dist --no-scripts --no-progress --no-install sylius/sylius-standard sylius "${{ matrix.sylius }}"

      # Because the sylius-standard has a soft constraint
      - name: Make sure to install the required version of Sylius
        working-directory: ./sylius
        run: |
            composer require --no-install --no-scripts --no-progress sylius/sylius="${{ matrix.sylius }}"

      # Because the sylius-standard requires Symfony ^7.4 by default
      - name: Make sure to install the required version of Symfony
        if: matrix.symfony
        working-directory: ./sylius
        run: |
            composer config --no-plugins extra.symfony.require "${{ matrix.symfony }}"

      # Because the sylius-standard < 2.3 registers FOSRestBundle, which sylius/paypal-plugin >= 2.1 no longer requires
      - name: Make sure FOSRestBundle is installed when registered
        working-directory: ./sylius
        run: |
            if grep -q FOSRestBundle config/bundles.php; then composer require --no-install --no-scripts --no-progress friendsofsymfony/rest-bundle="^3.7"; fi

      - name: Setup some requirements
        working-directory: ./sylius
        run: |
            composer config --no-plugins allow-plugins true
            composer config --no-plugins extra.symfony.allow-contrib true
            composer config --no-plugins secure-http false
            composer config --no-plugins --unset platform.php
            composer config --no-plugins extra.symfony.docker false
            composer config --no-plugins --json extra.symfony.endpoint '["https://api.github.com/repos/monsieurbiz/symfony-recipes/contents/index.json?ref=flex/master","flex://defaults"]'
            composer config repositories.plugin '{"type": "path", "url": "../plugin/"}'

      - name: Require plugin & install all dependencies
        working-directory: ./sylius
        run: |
          composer require monsieurbiz/sylius-rich-editor-plugin="*@dev"
