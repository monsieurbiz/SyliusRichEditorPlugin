name: Tests

on:
  push:
    branches: [ master ]
  pull_request:

jobs:

  php:

    name: PHP ${{ matrix.php }} / Sylius ${{ matrix.sylius }} / Symfony ${{ matrix.symfony }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', sylius: '2.1.0', symfony: '7.4', doctrine-orm: '3.5.0', node: '20' }
          - { php: '8.3', sylius: '2.1.0', symfony: '7.4', doctrine-orm: '3.5.0', node: '20' }
          - { php: '8.3', sylius: '2.2.0', symfony: '7.4', doctrine-orm: '3.5.0', node: '20' }
          - { php: '8.4', sylius: '2.3.0', symfony: '8', doctrine-orm: '3.6.0', node: '22', schema-validate-args: '--skip-sync' }
          - { php: '8.5', sylius: '2.3.0', symfony: '8', doctrine-orm: '3.6.0', node: '22', schema-validate-args: '--skip-sync' }

    env:
      SYMFONY_ARGS: --no-tls
      COMPOSER_ARGS: --prefer-dist
      DOCKER_INTERACTIVE_ARGS: -t

    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node }}
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, intl, json
          ini-values: date.timezone=UTC
          tools: symfony-cli

      - name: Set project php-version
        run: |
          echo "${{ matrix.php }}" > .php-version

      - name: Determine composer cache directory
        id: composer-cache-directory
        run: echo "directory=$(composer config cache-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies installed with composer
        uses: actions/cache@v3
        id: cache-composer
        with:
          path: ${{ steps.composer-cache-directory.outputs.directory }}
          key: composer2-php:${{ matrix.php }}-sylius:${{ matrix.sylius }}-symfony:${{ matrix.symfony }}-${{ github.sha }}
          restore-keys: composer2-php:${{ matrix.php }}-sylius:${{ matrix.sylius }}-symfony:${{ matrix.symfony }}-

      - name: Ensure that composer cache directory exists
        run: mkdir -p ${{ steps.composer-cache-directory.outputs.directory }}

      - name: Composer Github Auth
        run: composer config -g github-oauth.github.com ${{ github.token }}

      - run: make install SYLIUS_VERSION=${{ matrix.sylius }} SYMFONY_VERSION=${{ matrix.symfony }} DOCTRINE_ORM_VERSION=${{ matrix.doctrine-orm }}

      - run: make test.composer

      - run: make test.phpcs

      - run: make test.phpunit

      - run: make test.phpstan

      - run: make test.phpmd

      - run: make test.phpspec

      - run: make test.yaml

      - run: make test.twig

      # Sylius-Standard 2.3 migrations are not in sync with its own mapping on DBAL 4 (third-party tables only, the plugin has no entity)
      - run: make test.schema SCHEMA_VALIDATE_ARGS="${{ matrix.schema-validate-args }}"

      - run: make test.container
