      h1: '<h1>'
      h2: '<h2>'
      h3: '<h3>'
      h4: '<h4>'
      h5: '<h5>'
      h6: '<h6>'
    text_size:
      label: 'Text size'
      help: 'Bootstrap display utility classes: XS=display-6 (smallest) to XXL=display-1 (largest).'
      default: 'Default (Extra large)'
      xs: 'Extra Small'
      s: 'Small'
      m: 'Medium'
      l: 'Large'
      xl: 'Extra Large'
      xxl: 'Extra Extra Large'
    clipboard: 'Clipboard'
    paste_from_clipboard: 'Paste from clipboard'
    paste_all_from_clipboard: 'Paste all elements'
    copy_all_from_clipboard: 'Copy all elements'
    trash_all: 'Remove all elements'
    copied: 'Copied!'
    copy: 'Copy'
  action:
    new: 'Toggle available widgets'
    preview: 'Preview'
  error:
    cannot_parse_json: 'Cannot parse the current content'
    cannot_find_type: 'Cannot find type for some UI Elements'
    cannot_upload_image: 'Cannot upload the image. The file may be too large or have incorrect format.'
    ajax_error: 'There is a technical problem. Please contact your administrator.'
    unallowed_uielement: 'Element not allowed here'
  ui:
    disabled: 'Disabled'
  common:
    link_type: 'Link type'
