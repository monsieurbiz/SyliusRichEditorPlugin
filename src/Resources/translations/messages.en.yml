    move: 'Move'
    move_up: 'Move Up'
    move_down: 'Move Down'
    edit: 'Edit'
    delete: 'Delete'
    close: 'Close'
    confirm_delete: 'Are you sure to delete this element ?'
    apply_changes: 'Apply changes'
    cancel_changes: 'Cancel changes'
    placeholder: 'Drag widgets in this area'
    current_image: 'Current image'
    current_video: 'Current video'
    current_file: 'Current file'
    add_element: 'Add %uiElementTitle%'
    edit_element: 'Edit %uiElementTitle%'
    cancel: 'Cancel'
    save: 'Save'
    add_image: 'Add Image'
    delete_image: 'Remove Image'
    select_ui_element: 'Select an UI element'
    add_item: 'Add item'
    delete_item: 'Remove item'
    align:
      label: 'Alignment'
      help: 'CSS text-align property: left, center, right, justify, or inherit from parent.'
      default: 'Default'
      left: 'Left'
      center: 'Center'
      right: 'Right'
      justify: 'Justify'
    level:
      label: 'Level'
      help: 'Visual styling level: Primary, Secondary, Tertiary importance. Colors and appearance depend on active theme.'
      default: 'Default'
      primary: 'Primary'
      secondary: 'Secondary'
      tertiary: 'Tertiary'
    tag:
      label: 'HTML Tag'
      label_help: 'The HTML tag to use for this title. By default, it is a <div> tag.'
