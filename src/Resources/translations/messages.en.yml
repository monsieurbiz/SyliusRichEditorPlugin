monsieurbiz_richeditor_plugin:
  ui_element:
    monsieurbiz.column:
      title: 'Column Layout'
      description: 'A layout to display elements column by column'
      field:
        content: 'Content'
    monsieurbiz.row:
      title: 'Row Layout'
      description: 'A layout to display elements row by row'
      field:
        content: 'Content'
    monsieurbiz.html:
      title: 'HTML'
      description: 'An element with raw data'
      field:
        content: 'Content'
    monsieurbiz.text:
      title: 'Text'
      description: 'An element with a text content'
      field:
        content: 'Content'
    monsieurbiz.title:
      title: 'Title'
      short_description: 'A title element'
      description: 'An element containing the title you want'
      field:
        content: 'Content'
        text_size_help: 'Bootstrap display size: XS=display-6, S=display-5, M=display-4, L=display-3, XL=display-2, XXL=display-1. Overrides default size.'
        tag_help: 'HTML semantic tag (h1-h6 for SEO, div as default). Affects page structure and SEO ranking.'
    monsieurbiz.h1:
      title: '<h1> Title'
      short_description: 'Header level 1'
      description: 'An element containing the title you want'
      field:
        content: 'Content'
    monsieurbiz.h2:
      title: '<h2> Title'
      short_description: 'Header level 2'
      description: 'An element containing the title you want'
      field:
        content: 'Content'
    monsieurbiz.h3:
      title: '<h3> Title'
      short_description: 'Header level 3'
      description: 'An element containing the title you want'
      field:
        content: 'Content'
    monsieurbiz.image:
      title: 'Image'
      short_description: 'An element with an image, an alternative text and a title..'
      description: 'An element with an image, an alternative text and a title. A link can be added on it.'
      field:
        current_image: 'Current image'
        image: 'Image'
        alt: 'Alternative text'
        alt_help: 'Alternative text for screen readers and when image fails to load. Required for accessibility.'
        title: 'Title'
        title_help: 'Tooltip text displayed when hovering over the image. Optional descriptive text.'
        link: 'Link'
        link_help: 'Optional URL to navigate to when image is clicked. Wraps image in clickable link.'
        link_type_help: 'Internal links open in same tab; external links open in new tab with security attributes.'
    monsieurbiz.quote:
      title: 'Quote'
      description: 'An element with an author and a content'
      field:
        author: 'Author'
        content: 'Content'
    monsieurbiz.video:
      title: 'Video'
      short_description: 'Element with a video and a background video image'
      description: 'An element with a video file and a background image file rendering before you play the video'
      field:
        video: 'Video'
        image: 'Background image'
        image_help: 'Poster image shown before video plays. Sets ''poster'' attribute on HTML5 video element.'
        controls: 'Show controls'
        controls_help: 'Adds ''controls'' attribute to HTML5 video. Shows play/pause, timeline, and volume controls.'
        autoplay: 'Autoplay (without sound)'
        autoplay_help: 'Adds ''autoplay muted'' attributes. Browser policies require muted autoplay for user experience.'
        loop: 'Loop'
        loop_help: 'Adds ''loop'' attribute to HTML5 video. Restarts automatically when reaching the end.'
    monsieurbiz.separator:
      title: 'Separator'
      short_description: 'A separator'
      description: 'A separator element. The separator can be a hidden one.'
      field:
        hidden: 'Hidden separator'
        hidden_help: 'Creates invisible spacing without visible line (uses CSS ''invisible'' class).'
        style:
          label: 'Style'
          help: 'Border style: solid, dotted, or dashed line appearance.'
          choices:
            solid: 'Solid'
            dashed: 'Dashed'
            dotted: 'Dotted'
        thickness:
          label: 'Thickness'
          help: 'Border thickness: fine (1px), medium (2px), thick (4px), or very thick (5px).'
          choices:
            fine: 'Fine'
            medium: 'Medium'
            thick: 'Thick'
            very_thick: 'Very thick'
    monsieurbiz.anchor:
      title: Anchor
      description: "Add an anchor to be accessible by link with #"
      field:
        name: "Anchor's name (Without #)"
        name_help: "Unique identifier for page anchors (without #). Used in links like #section-name."
    monsieurbiz.button:
      title: 'Button'
      short_description: 'A button with a text and a link.'
      description: 'A button with a text and a link.'
      field:
        label: 'Label'
        link: 'Link'
        link_help: 'URL destination when button is clicked. Use relative paths (/page) for internal links.'
        link_type_help: 'Internal links open in same tab; external links open in new tab with security attributes.'
    monsieurbiz.youtube:
      title: 'Youtube'
      short_description: 'A Youtube element.'
      description: 'An element which displays a Youtube video.'
      field:
        link: 'Youtube link'
        width: 'Iframe width'
        height: 'Iframe height'
        width_help: 'Keep empty for a dynamic size'
        height_help: 'Keep empty for a dynamic size'
    monsieurbiz.image_collection:
      title: 'Image Collection'
      short_description: 'An element with multiple images.'
      description: 'An element with multiple images. A link can be added on each image.'
      field:
        images: 'Images list'
    monsieurbiz.markdown:
      title: 'Markdown'
      description: 'An element with markdown content'
      field:
        content: 'Content'
    monsieurbiz.two_columns:
      title: '2 Columns'
      description: '2 columns of content with dynamic width'
      fields:
        margin_auto: 'Automatic alignment'
        margin_auto_help: 'Adds Bootstrap ''m-auto'' class to center the column container horizontally.'
        reverse_mobile: 'Reverse order on mobile'
        reverse_mobile_help: 'Uses ''flex-column-reverse'' on mobile, ''flex-column'' otherwise. Changes stacking order below md breakpoint.'
        first_column: 'Content of the first column'
        first_column_width: 'First column width'
        first_column_width_help: 'Bootstrap grid ratio: 1/5=col-md-2/10, 1/2=col-md-6/6, etc. Second column takes remaining space.'
        second_column: 'Content of the second column'
      choices:
        first_column_width:
          width_1_5: '1/5 (20%)'
          width_1_4: '1/4 (25%)'
          width_1_3: '1/3 (33%)'
          width_2_5: '2/5 (40%)'
          width_1_2: '1/2 (50%)'
          width_3_5: '3/5 (60%)'
          width_2_3: '2/3 (66%)'
          width_3_4: '3/4 (75%)'
          width_4_5: '4/5 (80%)'
  file:
    change: 'Change file'
  form:
