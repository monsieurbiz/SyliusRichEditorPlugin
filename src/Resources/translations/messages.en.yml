monsieurbiz_richeditor_plugin:
  ui_element:
    monsieurbiz.column:
      title: 'Column Layout'
      description: >-
        Place several elements side by side, with one element per column.
        Use it to compare items, such as several images.
        For two columns with adjustable widths and several elements in each, use 2 Columns.
      field:
        content: 'Content'
    monsieurbiz.row:
      title: 'Row Layout'
      description: >-
        Group elements such as buttons in a horizontal row that can wrap onto another line.
        Use 2 Columns instead when you need two separate content areas with adjustable widths.
      field:
        content: 'Content'
    monsieurbiz.html:
      title: 'HTML'
      description: >-
        Insert trusted HTML when the other elements cannot produce the markup you need.
        The code is rendered as written. For ordinary copy next to a Title or Image, use Text instead.
      field:
        content: 'Content'
    monsieurbiz.text:
      title: 'Text'
      description: >-
        Write paragraphs, lists or links with the visual editor. Use it below a Title or next to an Image.
        Use a separate Button for a prominent link, or Quote when you want to attribute an excerpt.
      field:
        content: 'Content'
    monsieurbiz.title:
      title: 'Title'
      short_description: 'A title element'
      description: >-
        Introduce a section with a short heading, then add a Text element for the body.
        Choose the HTML level (H1 to H6) to match the page hierarchy. The default displays the text
        without making it a heading in that hierarchy. Set the visual size separately.
      field:
        content: 'Content'
        text_size_help: 'Bootstrap display size: XS=display-6, S=display-5, M=display-4, L=display-3, XL=display-2, XXL=display-1. Overrides default size.'
        tag_help: 'HTML semantic tag (h1-h6 for SEO, div as default). Affects page structure and SEO ranking.'
    monsieurbiz.h1:
      title: '<h1> Title'
      short_description: 'Header level 1'
      description: >-
        Mark the main heading of a page, then add Text for the introduction.
        Use it only if the page does not already have a main heading. This element always renders as H1.
      field:
        content: 'Content'
    monsieurbiz.h2:
      title: '<h2> Title'
      short_description: 'Header level 2'
      description: >-
        Introduce a main section under an H1, then add Text or other content below it.
        This element always renders as H2. Use H3 for a subsection.
      field:
        content: 'Content'
    monsieurbiz.h3:
      title: '<h3> Title'
      short_description: 'Header level 3'
      description: >-
        Introduce a subsection under an H2, then add Text or other content below it.
        This element always renders as H3. Use H2 for a main section.
      field:
        content: 'Content'
    monsieurbiz.image:
      title: 'Image'
      short_description: 'An element with an image, an alternative text and a title..'
      description: >-
        Show one image on its own or next to Text, for example in 2 Columns.
        Provide alternative text if the image conveys information. You can also make the image clickable.
        For a visible caption, add Text. To group several images in a grid, use Image Collection.
      field:
        current_image: 'Current image'
        image: 'Image'
        alt: 'Alternative text'
        alt_help: 'Alternative text for screen readers and when image fails to load. Required for accessibility.'
        title: 'Title'
        title_help: 'Tooltip text displayed when hovering over the image. Optional descriptive text.'
        link: 'Link'
        link_help: 'Optional URL to navigate to when image is clicked. Wraps image in clickable link.'
        link_type_help: 'Internal links open in same tab; external links open in new tab with security attributes.'
    monsieurbiz.quote:
      title: 'Quote'
      description: >-
        Highlight a testimonial or an excerpt and name its author.
        Add a separate Text element to introduce the quote or explain its context.
        Use Text instead if the passage is not a quotation.
      field:
        author: 'Author'
        content: 'Content'
    monsieurbiz.video:
      title: 'Video'
      short_description: 'Element with a video and a background video image'
      description: >-
        Play a video from a file. You can choose a cover image to show before playback starts.
        Use Text to introduce the video or provide a transcript. For a YouTube link, use the YouTube element instead.
      field:
        video: 'Video'
        image: 'Background image'
        image_help: 'Poster image shown before video plays. Sets ''poster'' attribute on HTML5 video element.'
        controls: 'Show controls'
        controls_help: 'Adds ''controls'' attribute to HTML5 video. Shows play/pause, timeline, and volume controls.'
        autoplay: 'Autoplay (without sound)'
        autoplay_help: 'Adds ''autoplay muted'' attributes. Browser policies require muted autoplay for user experience.'
        loop: 'Loop'
        loop_help: 'Adds ''loop'' attribute to HTML5 video. Restarts automatically when reaching the end.'
    monsieurbiz.separator:
      title: 'Separator'
      short_description: 'A separator'
      description: >-
        Mark a break between two sections, for example before the next Title.
        Choose a visible line or hide it to leave only space. This element does not add a heading or group the content.
      field:
        hidden: 'Hidden separator'
        hidden_help: 'Creates invisible spacing without visible line (uses CSS ''invisible'' class).'
        style:
          label: 'Style'
          help: 'Border style: solid, dotted, or dashed line appearance.'
          choices:
            solid: 'Solid'
            dashed: 'Dashed'
            dotted: 'Dotted'
        thickness:
          label: 'Thickness'
          help: 'Border thickness: fine (1px), medium (2px), thick (4px), or very thick (5px).'
          choices:
            fine: 'Fine'
            medium: 'Medium'
            thick: 'Thick'
            very_thick: 'Very thick'
    monsieurbiz.anchor:
      title: Anchor
      description: >-
        Set an invisible destination for a link within the page. Place it just before the target section,
        then point a Button or a Text link to #section-name. Give each anchor a unique name on the page,
        without the initial #.
      field:
        name: "Anchor's name (Without #)"
        name_help: "Unique identifier for page anchors (without #). Used in links like #section-name."
    monsieurbiz.button:
      title: 'Button'
      short_description: 'A button with a text and a link.'
      description: >-
        Highlight a link with a clear action label, such as “View the collection”.
        Place it after Text or near an Image. It can link to another page or to an Anchor on the same page.
        It does not submit a form. For a link within a paragraph, use Text.
      field:
        label: 'Label'
        link: 'Link'
        link_help: 'URL destination when button is clicked. Use relative paths (/page) for internal links.'
        link_type_help: 'Internal links open in same tab; external links open in new tab with security attributes.'
    monsieurbiz.youtube:
      title: 'Youtube'
      short_description: 'A Youtube element.'
      description: >-
        Embed a YouTube video from its link. Leave the dimensions empty for a player that adapts to the available width.
        Add Text to introduce the video. To play a video file instead of using a YouTube link, choose Video.
      field:
        link: 'Youtube link'
        width: 'Iframe width'
        height: 'Iframe height'
        width_help: 'Keep empty for a dynamic size'
        height_help: 'Keep empty for a dynamic size'
    monsieurbiz.image_collection:
      title: 'Image Collection'
      short_description: 'An element with multiple images.'
      description: >-
        Group several images in a grid. Each image can have its own alternative text and link.
        Add a Title above the grid if it needs an introduction. For a single image, use Image instead.
      field:
        images: 'Images list'
    monsieurbiz.markdown:
      title: 'Markdown'
      description: >-
        Write formatted content using Markdown syntax, for example lists or links below a Title.
        Use Text if you prefer a visual editor. Add a separate Button if a link needs to stand out.
      field:
        content: 'Content'
    monsieurbiz.two_columns:
      title: '2 Columns'
      description: >-
        Arrange exactly two groups of elements side by side, for example an Image on one side and a Title,
        Text and Button on the other. Choose the width split. On small screens the columns stack, and you can reverse their order.
      fields:
        margin_auto: 'Automatic alignment'
        margin_auto_help: 'Adds Bootstrap ''m-auto'' class to center the column container horizontally.'
        reverse_mobile: 'Reverse order on mobile'
        reverse_mobile_help: 'Uses ''flex-column-reverse'' on mobile, ''flex-column'' otherwise. Changes stacking order below md breakpoint.'
        first_column: 'Content of the first column'
        first_column_width: 'First column width'
        first_column_width_help: 'Bootstrap grid ratio: 1/5=col-md-2/10, 1/2=col-md-6/6, etc. Second column takes remaining space.'
        second_column: 'Content of the second column'
      choices:
        first_column_width:
          width_1_5: '1/5 (20%)'
          width_1_4: '1/4 (25%)'
          width_1_3: '1/3 (33%)'
          width_2_5: '2/5 (40%)'
          width_1_2: '1/2 (50%)'
          width_3_5: '3/5 (60%)'
          width_2_3: '2/3 (66%)'
          width_3_4: '3/4 (75%)'
          width_4_5: '4/5 (80%)'
  file:
    change: 'Change file'
  form:
    add: 'Add an element'
    move: 'Move'
    move_up: 'Move Up'
    move_down: 'Move Down'
    edit: 'Edit'
    delete: 'Delete'
    close: 'Close'
    confirm_delete: 'Are you sure to delete this element ?'
    apply_changes: 'Apply changes'
    cancel_changes: 'Cancel changes'
    placeholder: 'Drag widgets in this area'
    current_image: 'Current image'
    current_video: 'Current video'
    current_file: 'Current file'
    add_element: 'Add %uiElementTitle%'
    edit_element: 'Edit %uiElementTitle%'
    cancel: 'Cancel'
    save: 'Save'
    add_image: 'Add Image'
    delete_image: 'Remove Image'
    select_ui_element: 'Select an UI element'
    add_item: 'Add item'
    delete_item: 'Remove item'
    align:
      label: 'Alignment'
      help: 'CSS text-align property: left, center, right, justify, or inherit from parent.'
      default: 'Default'
      left: 'Left'
      center: 'Center'
      right: 'Right'
      justify: 'Justify'
    level:
      label: 'Level'
      help: 'Visual styling level: Primary, Secondary, Tertiary importance. Colors and appearance depend on active theme.'
      default: 'Default'
      primary: 'Primary'
      secondary: 'Secondary'
      tertiary: 'Tertiary'
    tag:
      label: 'HTML Tag'
      label_help: 'The HTML tag to use for this title. By default, it is a <div> tag.'
      default: 'Default (div)'
      h1: '<h1>'
      h2: '<h2>'
      h3: '<h3>'
      h4: '<h4>'
      h5: '<h5>'
      h6: '<h6>'
    text_size:
      label: 'Text size'
      help: 'Bootstrap display utility classes: XS=display-6 (smallest) to XXL=display-1 (largest).'
      default: 'Default (Extra large)'
      xs: 'Extra Small'
      s: 'Small'
      m: 'Medium'
      l: 'Large'
      xl: 'Extra Large'
      xxl: 'Extra Extra Large'
    clipboard: 'Clipboard'
    paste_from_clipboard: 'Paste from clipboard'
    paste_all_from_clipboard: 'Paste all elements'
    copy_all_from_clipboard: 'Copy all elements'
    trash_all: 'Remove all elements'
    copied: 'Copied!'
    copy: 'Copy'
  action:
    new: 'Toggle available widgets'
    preview: 'Preview'
  error:
    cannot_parse_json: 'Cannot parse the current content'
    cannot_find_type: 'Cannot find type for some UI Elements'
    cannot_upload_image: 'Cannot upload the image. The file may be too large or have incorrect format.'
    ajax_error: 'There is a technical problem. Please contact your administrator.'
    unallowed_uielement: 'Element not allowed here'
  ui:
    disabled: 'Disabled'
  common:
    link_type: 'Link type'
    link_type_help: 'Determines link behavior: internal (same tab) vs external (new tab with security attributes).'
    internal_link: 'Internal link'
    external_link: 'External link'
