monsieurbiz_richeditor_plugin:
  ui_element:
    monsieurbiz.column:
      title: 'Diseño de columna'
      description: 'Un diseño para mostrar elementos como una columna'
      field:
        content: 'Contenido'
    monsieurbiz.row:
      title: 'Diseño de fila'
      description: 'Un diseño para mostrar elementos como una fila'
      field:
        content: 'Contenido'
    monsieurbiz.html:
      title: 'HTML'
      description: 'Un elemento con datos en bruto'
      field:
        content: 'Contenido'
    monsieurbiz.text:
      title: 'Texto'
      description: 'Un elemento con contenido de texto'
      field:
        content: 'Contenido'
    monsieurbiz.title:
      title: 'Título'
      short_description: 'Un elemento de título'
      description: 'Un elemento que contiene el título que deseas'
      field:
        content: 'Contenido'
        text_size_help: 'Tamaño de pantalla Bootstrap: XS=display-6, S=display-5, M=display-4, L=display-3, XL=display-2, XXL=display-1. Reemplaza el tamaño por defecto.'
        tag_help: 'Etiqueta HTML semántica (h1-h6 para SEO, div por defecto). Afecta la estructura de página y clasificación SEO.'
    monsieurbiz.h1:
      title: '<h1> Título'
      short_description: 'Encabezado nivel 1'
      description: 'Un elemento que contiene el título que deseas'
      field:
        content: 'Contenido'
    monsieurbiz.h2:
      title: '<h2> Título'
      short_description: 'Encabezado nivel 2'
      description: 'Un elemento que contiene el título que deseas'
      field:
        content: 'Contenido'
    monsieurbiz.h3:
      title: '<h3> Título'
      short_description: 'Encabezado nivel 3'
      description: 'Un elemento que contiene el título que deseas'
      field:
        content: 'Contenido'
    monsieurbiz.image:
      title: 'Imagen'
      short_description: 'Un elemento con una imagen, un texto alternativo y un título.'
      description: 'Un elemento con una imagen, un texto alternativo y un título. Se puede agregar un enlace a él.'
      field:
        current_image: 'Imagen actual'
        image: 'Imagen'
        alt: 'Texto alternativo'
        alt_help: 'Texto alternativo para lectores de pantalla y cuando la imagen no carga. Requerido para accesibilidad.'
        title: 'Título'
        title_help: 'Texto de tooltip mostrado al pasar el cursor sobre la imagen. Texto descriptivo opcional.'
        link: 'Enlace'
        link_help: 'URL opcional para navegar cuando se hace clic en la imagen. Envuelve la imagen en un enlace clicable.'
        link_type_help: 'Los enlaces internos se abren en la misma pestaña; los enlaces externos se abren en nueva pestaña con atributos de seguridad.'
    monsieurbiz.quote:
      title: 'Cita'
      description: 'Un elemento con un autor y un contenido'
      field:
        author: 'Autor'
        content: 'Contenido'
    monsieurbiz.video:
      title: 'Video'
      short_description: 'Elemento con un video y una imagen de video de fondo'
      description: 'Un elemento con un archivo de video y un archivo de imagen de fondo que se renderiza antes de reproducir el video'
      field:
        video: 'Video'
        image: 'Imagen de fondo'
        image_help: 'Imagen poster mostrada antes de reproducir el video. Establece el atributo ''poster'' en el elemento video HTML5.'
        controls: 'Mostrar controles'
        controls_help: 'Añade el atributo ''controls'' al video HTML5. Muestra controles de play/pausa, línea de tiempo y volumen.'
        autoplay: 'Reproducción automática (sin sonido)'
        autoplay_help: 'Añade los atributos ''autoplay muted''. Las políticas del navegador requieren autoplay silenciado para la experiencia del usuario.'
        loop: 'Repetir'
        loop_help: 'Añade el atributo ''loop'' al video HTML5. Reinicia automáticamente al llegar al final.'
    monsieurbiz.separator:
      title: 'Separador'
      short_description: 'Un elemento separador'
      description: 'Un elemento separador. El separador puede ser uno oculto.'
      field:
        hidden: 'Separador oculto'
        hidden_help: 'Crea espaciado invisible sin línea visible (usa la clase CSS ''invisible'').'
        style:
          label: 'Estilo'
          help: 'Estilo de borde: sólido, punteado o rayado.'
          choices:
            solid: 'Sólido'
            dashed: 'Rayado'
            dotted: 'Punteado'
        thickness:
          label: 'Grosor'
          help: 'Grosor del borde: fino (1px), medio (2px), grueso (4px) o muy grueso (5px).'
          choices:
            fine: 'Fino'
            medium: 'Medio'
            thick: 'Grueso'
            very_thick: 'Muy grueso'
    monsieurbiz.anchor:
      title: Ancla
      description: Añadir un ancla accesible por enlace con `#`
      field:
        name: Nombre del ancla (Sin el `#`)
        name_help: Identificador único para anclas de página (sin #). Usado en enlaces como #nombre-seccion.
    monsieurbiz.button:
      title: 'Botón'
      short_description: 'Un botón con un texto y un enlace.'
      description: 'Un botón con un texto y un enlace.'
      field:
        label: 'Etiqueta'
        link: 'Enlace'
        link_help: 'URL de destino cuando se hace clic en el botón. Use rutas relativas (/pagina) para enlaces internos.'
        link_type_help: 'Los enlaces internos se abren en la misma pestaña; los enlaces externos se abren en nueva pestaña con atributos de seguridad.'
    monsieurbiz.youtube:
      title: 'Youtube'
      short_description: 'Un elemento de Youtube.'
      description: 'Un elemento que muestra un video de Youtube.'
      field:
        link: 'Enlace de Youtube'
        width: 'Ancho del iframe'
        width_help: 'Ancho fijo del iframe en píxeles. Si solo se establece el ancho, la altura se calcula usando proporción 16:9. Vacío = responsivo.'
        height: 'Altura del iframe'
        height_help: 'Altura fija del iframe en píxeles. Si solo se establece la altura, el ancho se calcula usando proporción 16:9. Vacío = responsivo.'
    monsieurbiz.image_collection:
      title: 'Colección de imágenes'
      short_description: 'Un elemento con varias imágenes.'
      description: 'Un elemento con varias imágenes. Se puede agregar un enlace a cada imagen.'
      field:
        images: 'Lista de imágenes'
    monsieurbiz.markdown:
      title: 'Markdown'
      description: 'Un elemento con contenido en markdown'
      field:
        content: 'Contenido'
    monsieurbiz.two_columns:
      title: '2 Columnas'
      description: '2 columnas de contenido con ancho dinámico'
      fields:
        margin_auto: 'Alineación automática'
        margin_auto_help: 'Añade la clase Bootstrap ''m-auto'' para centrar el contenedor de columnas horizontalmente.'
        reverse_mobile: 'Invertir orden en móvil'
        reverse_mobile_help: 'Usa ''flex-column-reverse'' en móvil, ''flex-column'' en otros casos. Cambia el orden de apilamiento bajo el breakpoint md.'
        first_column: 'Contenido de la primera columna'
        first_column_width: 'Ancho de la primera columna'
        first_column_width_help: 'Proporción de rejilla Bootstrap: 1/5=col-md-2/10, 1/2=col-md-6/6, etc. La segunda columna toma el espacio restante.'
        second_column: 'Contenido de la segunda columna'
      choices:
        first_column_width:
          width_1_5: '1/5 (20%)'
          width_1_4: '1/4 (25%)'
          width_1_3: '1/3 (33%)'
          width_2_5: '2/5 (40%)'
          width_1_2: '1/2 (50%)'
          width_3_5: '3/5 (60%)'
          width_2_3: '2/3 (66%)'
          width_3_4: '3/4 (75%)'
          width_4_5: '4/5 (80%)'
