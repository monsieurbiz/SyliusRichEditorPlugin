        link_help: 'URL de destination quand le bouton est cliqué. Utilisez des chemins relatifs (/page) pour les liens internes.'
        link_type_help: 'Les liens internes s''ouvrent dans le même onglet ; les liens externes s''ouvrent dans un nouvel onglet avec des attributs de sécurité.'
