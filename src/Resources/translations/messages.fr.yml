        video: 'Vidéo'
        image: 'Image de fond'
        image_help: 'Image poster affichée avant que la vidéo ne joue. Définit l''attribut ''poster'' sur l''élément vidéo HTML5.'
        controls: 'Afficher les contrôles'
        controls_help: 'Ajoute l''attribut ''controls'' à la vidéo HTML5. Affiche les contrôles play/pause, timeline et volume.'
        autoplay: 'Lancer automatiquement la vidéo (sans le son)'
        autoplay_help: 'Ajoute les attributs ''autoplay muted''. Les politiques des navigateurs exigent l''autoplay muet pour l''expérience utilisateur.'
        loop: 'Jouer en boucle'
        loop_help: 'Ajoute l''attribut ''loop'' à la vidéo HTML5. Redémarre automatiquement à la fin.'
