            solid: 'Solide'
            dashed: 'Pointillé'
            dotted: 'Pointé'
        thickness:
          label: 'Épaisseur'
          help: 'Épaisseur de bordure : fine (1px), moyenne (2px), épaisse (4px), ou très épaisse (5px).'
          choices:
            fine: 'Fine'
            medium: 'Moyenne'
            thick: 'Épaisse'
            very_thick: 'Très épaisse'
