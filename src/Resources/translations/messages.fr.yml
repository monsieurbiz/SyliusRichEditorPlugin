monsieurbiz_richeditor_plugin:
  ui_element:
    monsieurbiz.column:
      title: 'Colonne'
      description: >-
        Placez plusieurs éléments côte à côte, à raison d'un élément par colonne.
        Choisissez cette lame pour comparer des éléments, par exemple plusieurs images.
        Pour deux colonnes de largeur réglable contenant chacune plusieurs éléments, choisissez 2 Colonnes.
      field:
        content: 'Contenu'
    monsieurbiz.row:
      title: 'Ligne'
      description: >-
        Alignez des éléments, comme des boutons, sur une ligne. Ils passent à la ligne si la place manque.
        Choisissez 2 Colonnes si vous voulez deux zones de contenu distinctes dont vous pouvez ajuster la largeur.
      field:
        content: 'Contenu'
    monsieurbiz.html:
      title: 'HTML'
      description: >-
        Insérez du code HTML de confiance si les autres lames ne produisent pas le balisage dont vous avez besoin.
        Le code s'affiche tel quel. Pour du contenu courant à côté d'un Titre ou d'une Image, choisissez plutôt Texte.
      field:
        content: 'Contenu'
    monsieurbiz.text:
      title: 'Texte'
      description: >-
        Rédigez des paragraphes, des listes ou des liens dans l'éditeur visuel. Placez le texte sous un Titre ou à côté d'une Image.
        Pour mettre un lien en avant, ajoutez un Bouton. Pour attribuer un extrait à son auteur, choisissez Citation.
      field:
        content: 'Contenu'
    monsieurbiz.title:
      title: 'Titre'
      short_description: 'Une lame contenant un titre'
      description: >-
        Introduisez une section par un titre court, puis ajoutez une lame Texte pour le développer.
        Choisissez le niveau HTML (H1 à H6) selon la hiérarchie de la page. Par défaut, le titre s'affiche sans faire partie
        de cette hiérarchie. Réglez séparément sa taille d'affichage.
      field:
        content: 'Contenu'
        text_size_help: 'Taille d''affichage Bootstrap : XS=display-6, S=display-5, M=display-4, L=display-3, XL=display-2, XXL=display-1. Remplace la taille par défaut.'
        tag_help: 'Balise HTML sémantique (h1-h6 pour le SEO, div par défaut). Affecte la structure de page et le classement SEO.'
    monsieurbiz.h1:
      title: '<h1> Titre'
      short_description: 'Une lame contenant un titre niveau 1'
      description: >-
        Indiquez le titre principal de la page, puis ajoutez une lame Texte pour l'introduction.
        Utilisez cette lame seulement si la page n'a pas déjà de titre principal. Elle produit toujours un H1.
      field:
        content: 'Contenu'
    monsieurbiz.h2:
      title: '<h2> Titre'
      short_description: 'Une lame contenant un titre niveau 2'
      description: >-
        Introduisez une section principale sous un H1, puis ajoutez du Texte ou d'autres lames en dessous.
        Cette lame produit toujours un H2. Pour une sous-section, choisissez H3.
      field:
        content: 'Contenu'
    monsieurbiz.h3:
      title: '<h3> Titre'
      short_description: 'Une lame contenant un titre niveau 3'
      description: >-
        Introduisez une sous-section sous un H2, puis ajoutez du Texte ou d'autres lames en dessous.
        Cette lame produit toujours un H3. Pour une section principale, choisissez H2.
      field:
        content: 'Contenu'
    monsieurbiz.image:
      title: 'Image'
      short_description: 'Une lame contenant une image avec un champ alternatif et un titre.'
      description: >-
        Affichez une image seule ou à côté d'un Texte, par exemple dans 2 Colonnes.
        Renseignez un texte alternatif si l'image transmet une information. Vous pouvez aussi rendre l'image cliquable.
        Pour une légende visible, ajoutez une lame Texte. Pour regrouper plusieurs images en grille, choisissez Collection d'images.
      field:
        current_image: 'Image actuelle'
        image: 'Image'
        alt: 'Texte alternatif'
        alt_help: 'Texte alternatif pour les lecteurs d''écran et quand l''image ne se charge pas. Requis pour l''accessibilité.'
        title: 'Titre'
        title_help: 'Texte d''info-bulle affiché au survol de l''image. Texte descriptif optionnel.'
        link: 'Lien'
        link_help: 'URL optionnelle pour naviguer quand l''image est cliquée. Entoure l''image d''un lien cliquable.'
        link_type_help: 'Les liens internes s''ouvrent dans le même onglet ; les liens externes s''ouvrent dans un nouvel onglet avec des attributs de sécurité.'
    monsieurbiz.quote:
      title: 'Citation'
      description: >-
        Mettez en valeur un témoignage ou un extrait en indiquant son auteur.
        Ajoutez une lame Texte à part pour introduire la citation ou expliquer son contexte.
        Si le passage n'est pas une citation, choisissez plutôt Texte.
      field:
        author: 'Auteur'
        content: 'Contenu'
    monsieurbiz.video:
      title: 'Vidéo'
      short_description: 'Une lame contenant une vidéo et une image de fond'
      description: >-
        Lisez une vidéo à partir d'un fichier. Vous pouvez choisir une image à afficher avant le début de la lecture.
        Ajoutez une lame Texte pour présenter la vidéo ou fournir une transcription. Si vous avez un lien YouTube, choisissez la lame YouTube.
      field:
        video: 'Vidéo'
        image: 'Image de fond'
        image_help: 'Image poster affichée avant que la vidéo ne joue. Définit l''attribut ''poster'' sur l''élément vidéo HTML5.'
        controls: 'Afficher les contrôles'
        controls_help: 'Ajoute l''attribut ''controls'' à la vidéo HTML5. Affiche les contrôles play/pause, timeline et volume.'
        autoplay: 'Lancer automatiquement la vidéo (sans le son)'
        autoplay_help: 'Ajoute les attributs ''autoplay muted''. Les politiques des navigateurs exigent l''autoplay muet pour l''expérience utilisateur.'
        loop: 'Jouer en boucle'
        loop_help: 'Ajoute l''attribut ''loop'' à la vidéo HTML5. Redémarre automatiquement à la fin.'
    monsieurbiz.separator:
      title: 'Séparateur'
      short_description: 'Une lame permettant de faire séparateur'
      description: >-
        Marquez une coupure entre deux sections, par exemple avant le Titre suivant.
        Affichez un trait ou masquez-le pour ne garder qu'un espace. Cette lame ne crée pas de titre et ne regroupe pas le contenu.
      field:
        hidden: 'Séparateur caché'
        hidden_help: 'Crée un espacement invisible sans ligne visible (utilise la classe CSS ''invisible'').'
        style:
          label: 'Style'
          help: 'Style de bordure : solide, pointé ou tirets.'
          choices:
            solid: 'Solide'
            dashed: 'Pointillé'
            dotted: 'Pointé'
        thickness:
          label: 'Épaisseur'
          help: 'Épaisseur de bordure : fine (1px), moyenne (2px), épaisse (4px), ou très épaisse (5px).'
          choices:
            fine: 'Fine'
            medium: 'Moyenne'
            thick: 'Épaisse'
            very_thick: 'Très épaisse'
    monsieurbiz.anchor:
      title: 'Ancre'
      description: >-
        Créez une destination invisible pour un lien dans la page. Placez-la juste avant la section à atteindre,
        puis faites pointer un Bouton ou un lien dans un Texte vers #nom-section. Donnez à chaque ancre un nom unique dans la page,
        sans le # initial.
      field:
        name: "Nom de l'ancre (Sans le #)"
        name_help: "Identifiant unique pour les ancres de page (sans #). Utilisé dans les liens comme #nom-section."
    monsieurbiz.button:
      title: 'Bouton'
      short_description: 'Un bouton avec un texte et un lien.'
      description: >-
        Mettez un lien en avant avec un libellé d'action clair, par exemple « Voir la collection ».
        Placez-le après un Texte ou près d'une Image. Il peut mener vers une autre page ou vers une Ancre sur la même page.
        Il ne sert pas à envoyer un formulaire. Pour un lien dans un paragraphe, choisissez Texte.
      field:
        label: 'Libellé'
        link: 'Lien'
        link_help: 'URL de destination quand le bouton est cliqué. Utilisez des chemins relatifs (/page) pour les liens internes.'
        link_type_help: 'Les liens internes s''ouvrent dans le même onglet ; les liens externes s''ouvrent dans un nouvel onglet avec des attributs de sécurité.'
    monsieurbiz.youtube:
      title: 'Youtube'
      short_description: 'Une vidéo youtube.'
      description: >-
        Intégrez une vidéo YouTube à partir de son lien. Laissez les dimensions vides pour que le lecteur s'adapte à la largeur disponible.
        Ajoutez du Texte pour présenter la vidéo. Si vous avez un fichier vidéo plutôt qu'un lien YouTube, choisissez Vidéo.
      field:
        link: 'Lien Youtube'
        width: 'Largeur du lecteur'
        height: 'Hauteur du lecteur'
        width_help: 'Laissez vide pour une taille dynamique'
        height_help: 'Laissez vide pour une taille dynamique'
    monsieurbiz.image_collection:
      title: 'Collection d''images'
      short_description: 'Une lame contenant une liste d''images.'
      description: >-
        Regroupez plusieurs images dans une grille. Chaque image peut avoir son propre texte alternatif et son propre lien.
        Ajoutez un Titre au-dessus de la grille pour la présenter. Pour une seule image, choisissez Image.
      field:
        images: 'Liste d''images'
    monsieurbiz.markdown:
      title: 'Markdown'
      description: >-
        Rédigez du contenu mis en forme avec la syntaxe Markdown, par exemple des listes ou des liens sous un Titre.
        Choisissez Texte si vous préférez un éditeur visuel. Ajoutez un Bouton séparé pour mettre un lien en avant.
      field:
        content: 'Contenu'
    monsieurbiz.two_columns:
      title: '2 Colonnes'
      description: >-
        Placez deux groupes d'éléments côte à côte, par exemple une Image d'un côté et un Titre,
        un Texte et un Bouton de l'autre. Choisissez la répartition des largeurs.
        Sur petit écran, les colonnes s'empilent et vous pouvez inverser leur ordre.
      fields:
        margin_auto: 'Alignement automatique'
        margin_auto_help: 'Ajoute la classe Bootstrap ''m-auto'' pour centrer le conteneur de colonnes horizontalement.'
        reverse_mobile: 'Inverser l''ordre sur mobile'
        reverse_mobile_help: 'Utilise ''flex-column-reverse'' sur mobile, ''flex-column'' sinon. Change l''ordre d''empilement sous le breakpoint md.'
        first_column: 'Contenu de la première colonne'
        first_column_width: 'Largeur de la première colonne'
        first_column_width_help: 'Ratio de grille Bootstrap : 1/5=col-md-2/10, 1/2=col-md-6/6, etc. La deuxième colonne prend l''espace restant.'
        second_column: 'Contenu de la seconde colonne'
      choices:
        first_column_width:
          width_1_5: '1/5 (20%)'
          width_1_4: '1/4 (25%)'
          width_1_3: '1/3 (33%)'
          width_2_5: '2/5 (40%)'
          width_1_2: '1/2 (50%)'
          width_3_5: '3/5 (60%)'
          width_2_3: '2/3 (66%)'
          width_3_4: '3/4 (75%)'
          width_4_5: '4/5 (80%)'
