        first_column_width_help: 'Ratio de grille Bootstrap : 1/5=col-md-2/10, 1/2=col-md-6/6, etc. La deuxième colonne prend l''espace restant.'
        second_column: 'Contenu de la seconde colonne'
      choices:
        first_column_width:
