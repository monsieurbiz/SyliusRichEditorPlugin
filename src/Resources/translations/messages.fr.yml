      title: '2 Colonnes'
      description: '2 colonnes de contenu avec largeur dynamique'
      fields:
        margin_auto: 'Alignement automatique'
        margin_auto_help: 'Ajoute la classe Bootstrap ''m-auto'' pour centrer le conteneur de colonnes horizontalement.'
        reverse_mobile: 'Inverser l''ordre sur mobile'
        reverse_mobile_help: 'Utilise ''flex-column-reverse'' sur mobile, ''flex-column'' sinon. Change l''ordre d''empilement sous le breakpoint md.'
        first_column: 'Contenu de la première colonne'
